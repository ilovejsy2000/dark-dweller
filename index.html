<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>다크 드웰러</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* 배치: 화면 가득 캔버스 한 장. 판 중 정보는 네 모서리, 거점·선택·결과는 금테 두른 판, 장비·창고는 화면 전체(위는 몸 부위 칸, 아래는 창고). */
:root{
  color-scheme: dark;
  --ink:#0a0c17;       /* 가장 어두운 테두리 */
  --night:#0f1424;     /* 밤 바탕 */
  --panel-1:#262f52;   /* 판 위쪽 */
  --panel-2:#141a31;   /* 판 아래쪽 */
  --well:#0e1326;      /* 움푹한 칸 */
  --line:#46527f;      /* 판 안쪽 선 */
  --gold-1:#fff0c2;    /* 금빛 밝은 쪽 */
  --gold-2:#e6b450;    /* 금빛 */
  --gold-3:#8a5a1c;    /* 금빛 어두운 쪽 */
  --paper:#efe6d2;     /* 글자 */
  --dim:#9aa3bf;       /* 흐린 글자 */
  --blood:#e0524f;     /* 체력·위험 */
  --xp:#5fd3c4;        /* 경험치·특수 */
  --ember:#ff9a3c;     /* 불빛 */
  --font-display:"Noto Serif KR","Nanum Myeongjo","Batang",serif;        /* 제목·이름 */
  --font-body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif; /* 본문·숫자 */
  --goldfill:linear-gradient(180deg,var(--gold-1) 8%,var(--gold-2) 55%,#a86c1e 100%);
}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--paper);font-family:var(--font-body);font-size:14px;overflow:hidden}
[hidden]{display:none!important}
button{font-family:var(--font-body);-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold-1);outline-offset:2px}
#game{position:relative;height:100%;overflow:hidden;background:var(--night);user-select:none;-webkit-user-select:none}
#cv{display:block;width:100%;height:100%;touch-action:none}
/* 금빛 글자 */
.gold{background:var(--goldfill);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 0 10px rgba(230,180,80,.3))}

/* ── 판 중 정보 ── */
#hud{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:auto auto 1fr auto;gap:6px 8px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px;align-items:center;min-width:0}
.lvb{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;font:700 15px var(--font-body);color:var(--gold-1);font-variant-numeric:tabular-nums;
  background:radial-gradient(circle at 50% 35%,#34406e,#151b33 70%);box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--gold-2),0 0 0 6px var(--ink),0 3px 8px rgba(0,0,0,.5)}
.bars{display:grid;gap:5px;min-width:0;max-width:160px}
.bar{position:relative;box-sizing:border-box;height:16px;background:var(--well);border:1px solid #5a668f;border-radius:8px;box-shadow:0 0 0 2px var(--ink),0 2px 5px rgba(0,0,0,.5);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(180deg,#ff8f7d,#e0524f 45%,#a52a35);box-shadow:inset 0 1px 0 rgba(255,255,255,.45);transition:width .12s linear}
.bar.xp{height:9px;border-radius:5px}
.bar.xp i{width:0;background:linear-gradient(180deg,#a9f3e8,#5fd3c4 50%,#2f9d93)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:10.5px;letter-spacing:.02em;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px var(--ink),0 0 3px var(--ink)}
.tc{justify-self:center;display:grid;justify-items:center;gap:1px}
#timer{font:900 27px/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
#goal{font-weight:700;font-size:10.5px;color:var(--dim);text-shadow:0 1px 2px var(--ink),0 0 4px var(--ink);white-space:nowrap}
#event{min-height:1.2em;font-weight:700;font-size:12px;color:var(--paper);text-shadow:0 1px 2px var(--ink),0 0 4px var(--ink)}
#event.burn{font:900 15px var(--font-display);color:var(--ember);text-shadow:0 2px 0 var(--ink),0 0 10px rgba(255,154,60,.6)}
.tr{display:grid;gap:6px;justify-items:end;align-content:start}
#pauseBtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:1px solid #6a76a3;color:var(--paper);font-weight:700;font-size:13px;letter-spacing:.1em;cursor:pointer;
  background:linear-gradient(180deg,#323c66,#1a2040);box-shadow:0 0 0 2px var(--ink),0 3px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14)}
.kl{font-weight:700;font-size:12px;color:var(--dim);text-shadow:0 1px 2px var(--ink),0 0 4px var(--ink)}
.kl b{font-size:15px;color:var(--paper);font-variant-numeric:tabular-nums;margin-left:3px}
#bossBar{grid-column:1 / -1;grid-row:2;justify-self:center;width:min(300px,84%);display:grid;gap:4px;justify-items:center}
#bossBar b{font:900 16px var(--font-display);letter-spacing:.06em}
.bar.boss{width:100%;height:13px}
.bar.boss i{background:linear-gradient(180deg,#ffb66b,#e0524f 55%,#8f1f33)}
#banner{grid-column:1 / -1;grid-row:3;align-self:start;justify-self:center;margin-top:9vh;font:900 clamp(30px,8.5vw,54px)/1.1 var(--font-display);letter-spacing:.04em;animation:bannerPop 1.3s ease-out both}
@keyframes bannerPop{0%{transform:scale(.4);opacity:0}16%{transform:scale(1.16);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
#note{grid-column:1 / -1;grid-row:3;align-self:end;justify-self:center;margin-bottom:8px;font-weight:700;font-size:12.5px;color:var(--paper);background:rgba(10,12,23,.8);border:1px solid #3a456e;border-radius:99px;padding:5px 14px}
#toasts{grid-column:1 / -1;grid-row:4;display:grid;gap:5px;justify-items:start;align-content:end}
.toast{max-width:min(420px,92vw);background:linear-gradient(90deg,rgba(10,12,23,.94),rgba(20,26,49,.86));border:1px solid var(--gc);border-left-width:5px;border-radius:8px;padding:5px 11px;
  box-shadow:0 0 0 2px var(--ink),0 0 16px -4px var(--gc);animation:toastIn .22s cubic-bezier(.2,1.5,.4,1) both;transition:opacity .5s}
.toast b{display:block;font:700 14px var(--font-display);color:var(--gc)}
.toast span{display:block;font-size:11.5px;color:var(--paper);opacity:.85}
@keyframes toastIn{from{transform:translateX(-18px);opacity:0}to{transform:none;opacity:1}}
/* 보스 등장 연출 */
#cine{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto;z-index:3}
#cine::before,#cine::after{content:"";height:13vh;background:#05060f;animation:barIn .35s ease-out both}
#cine::before{grid-row:1;transform-origin:top}
#cine::after{grid-row:3;transform-origin:bottom}
@keyframes barIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#cine .ttl{grid-row:2;align-self:end;justify-self:center;margin-bottom:5vh;text-align:center;animation:ttlIn .5s .2s cubic-bezier(.2,1.4,.4,1) both}
@keyframes ttlIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#cine small{display:block;font-weight:700;letter-spacing:.4em;font-size:12px;color:var(--blood);text-shadow:0 0 6px var(--ink),0 0 6px var(--ink)}
#cine b{font:900 clamp(34px,10vw,60px)/1.15 var(--font-display);letter-spacing:.06em}

/* ── 겹쳐 뜨는 판 ── */
.overlay{position:absolute;inset:0;display:grid;place-items:center;overflow:auto;background:radial-gradient(ellipse at 50% 40%,rgba(10,12,30,.5),rgba(5,6,14,.82));
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay.bottom{place-items:end center;background:linear-gradient(180deg,rgba(10,12,30,0) 30%,rgba(5,6,14,.7))}
.card{position:relative;width:min(520px,100%);box-sizing:border-box;display:grid;gap:12px;text-align:center;padding:20px 18px 18px;border-radius:14px;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel-1),var(--panel-2));
  box-shadow:0 0 0 2px var(--ink),0 0 0 3px var(--gold-3),0 0 0 5px var(--ink),0 14px 34px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1)}
.card::before{content:"";position:absolute;top:-7px;left:50%;width:11px;height:11px;transform:translateX(-50%) rotate(45deg);background:var(--gold-2);box-shadow:0 0 0 2px var(--ink)}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:11.5px;letter-spacing:.22em;color:var(--gold-2)}
.eyebrow::before,.eyebrow::after{content:"";height:1px;width:34px;background:linear-gradient(90deg,transparent,var(--gold-3))}
.eyebrow::after{transform:scaleX(-1)}
h1,h2{margin:0;font-family:var(--font-display);font-weight:900;text-wrap:balance;letter-spacing:.04em}
h1{font-size:clamp(34px,10.5vw,50px);line-height:1.1}
h2{font-size:24px}
.sub{margin:0;font-size:12.5px;color:var(--dim);line-height:1.55;text-wrap:pretty}
.lab{font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--dim);text-align:left}
.btns{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;align-items:center}
.go{font:900 20px var(--font-display);letter-spacing:.12em;color:#2a1904;cursor:pointer;padding:10px 38px;border-radius:12px;border:1px solid #6b4513;text-shadow:0 1px 0 rgba(255,255,255,.45);
  background:linear-gradient(180deg,#fff0c2 0%,#f0bb52 45%,#c5861f 100%);box-shadow:0 0 0 2px var(--ink),0 4px 0 #6b4513,0 6px 0 var(--ink),inset 0 1px 0 rgba(255,255,255,.7)}
.go:active{transform:translateY(4px);box-shadow:0 0 0 2px var(--ink),0 0 0 #6b4513,0 2px 0 var(--ink),inset 0 1px 0 rgba(255,255,255,.7)}
.go.sm{font-size:15px;padding:7px 22px;letter-spacing:.08em}
.ghost{font-weight:700;font-size:13px;color:var(--paper);cursor:pointer;padding:8px 15px;border-radius:9px;border:1px solid #5a668f;
  background:linear-gradient(180deg,#2f3960,#1a2040);box-shadow:0 0 0 2px var(--ink),inset 0 1px 0 rgba(255,255,255,.12)}
.ghost:active{transform:translateY(1px)}
.ghost.warn{color:#ff9d94;border-color:#7d3d48}
.modes,.seg,#maps{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px}
.modes button,.seg button,#maps button{min-width:0;font-weight:700;font-size:12.5px;color:var(--paper);cursor:pointer;padding:8px 2px;border-radius:8px;border:1px solid #4a5684;
  background:linear-gradient(180deg,#252d50,#161b36);box-shadow:0 0 0 2px var(--ink),inset 0 1px 0 rgba(255,255,255,.08)}
.modes button[aria-pressed="true"],.seg button[aria-pressed="true"],#maps button[aria-pressed="true"]{color:#2a1904;border-color:#6b4513;background:linear-gradient(180deg,#fff0c2,#e6b450 60%,#c5861f);text-shadow:0 1px 0 rgba(255,255,255,.4)}
#maps button{display:grid;gap:2px;padding:7px 2px 6px}
#dailyRow{margin-top:6px}#dailyRow button{width:100%;display:grid;gap:2px;padding:7px 4px 6px;cursor:pointer;border-radius:8px;color:#fff3d6;border:1px solid #b8862e;
  background:linear-gradient(180deg,#4a3418,#22180c);box-shadow:0 0 0 2px var(--ink),inset 0 1px 0 rgba(255,255,255,.1)}#dailyRow b{font:700 13px var(--font-display);letter-spacing:.06em}#dailyRow i{font-style:normal;font-size:10px;color:#e6c37a}
#dailyRow button[aria-pressed="true"]{color:#2a1904;border-color:#6b4513;background:linear-gradient(180deg,#fff0c2,#e6b450 60%,#c5861f)}#dailyRow button[aria-pressed="true"] i{color:#7a4a10}
#quest{display:block;margin-top:2px;font-size:11.5px;font-weight:700;color:#ffe08a;text-shadow:0 1px 0 #000,0 0 6px #000}
.choice.rare{border-color:#ffd56a;background:linear-gradient(180deg,#5a4614,#2a2008);box-shadow:0 0 0 2px var(--ink),0 3px 0 var(--ink),0 0 22px -2px rgba(255,214,90,.75),inset 0 1px 0 rgba(255,240,194,.3);animation:rareGlow 1.2s ease-in-out infinite alternate}
@keyframes rareGlow{to{box-shadow:0 0 0 2px var(--ink),0 3px 0 var(--ink),0 0 30px 2px rgba(255,214,90,.9),inset 0 1px 0 rgba(255,240,194,.3)}}
.choice em.rr{color:#2a1904;background:linear-gradient(90deg,#fff0c2,#ffd56a)}
#pactList{display:grid;gap:9px}.choice.pact{grid-template-columns:40px minmax(0,1fr)}.choice.pact .pi{font-size:26px;color:#c8a0ff;text-align:center}
.choice.pact .pc{color:#ff9d94;font-weight:700}.choice.pact .pg{color:#ffe08a;font-weight:700}
#talList{display:grid;gap:6px;max-height:58vh;overflow:auto;text-align:left}.talrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;background:rgba(30,36,66,.7);border:1px solid #3a456e}
.talrow>div{flex:1;min-width:0}.talrow b{color:var(--gold-1);font:700 14px var(--font-display)}.talrow .lv{margin-left:8px;font-size:11px;color:var(--dim)}.talrow p{margin:2px 0 0;font-size:11.5px;color:#c2c8dc}
.talrow.max b{color:#ffd56a}.talrow button:disabled,.btns button:disabled{opacity:.45;cursor:default}
#cxList{max-height:60vh;overflow:auto;text-align:left}.cxh{margin:8px 0 5px;font-weight:700;color:var(--gold-1);font-size:13px}
.cxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:5px}.cxt{display:grid;justify-items:center;gap:2px;padding:4px;border-radius:8px;background:rgba(30,36,66,.7)}
.cxt img{width:44px;height:44px;object-fit:contain}.cxt small{font-size:9.5px;text-align:center;color:#c2c8dc;line-height:1.2}.cxt.no{opacity:.45}.cxt.no img{filter:brightness(0)}
.cxg.names{display:flex;flex-wrap:wrap;gap:5px}.cxg.names span{font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(30,36,66,.8)}.cxg.names .lg{color:#ff9a3c}.cxg.names .my{color:#ff5ad1}.cxg.names .no{color:#6b7394}
.rmsg{color:#ffe08a!important}
#riftRow{margin-top:6px}#riftRow button{width:100%;display:grid;gap:2px;padding:8px 4px 7px;cursor:pointer;border-radius:8px;color:#f3e6ff;border:1px solid #7a4fd0;
  background:linear-gradient(180deg,#3a2466,#1b1236);box-shadow:0 0 0 2px var(--ink),0 0 14px rgba(150,90,255,.35),inset 0 1px 0 rgba(255,255,255,.1)}
#riftRow b{font:700 14px var(--font-display);letter-spacing:.08em}#riftRow i{font-style:normal;font-size:10px;color:#cdb6ff}
#riftRow button[aria-pressed="true"]{color:#2a1904;border-color:#6b4513;background:linear-gradient(180deg,#fff0c2,#e6b450 60%,#c5861f)}#riftRow button[aria-pressed="true"] i{color:#7a4a10}
#riftRow button.lock{filter:grayscale(.7) brightness(.75)}
#tierRow{grid-template-columns:56px 1fr 56px;grid-auto-flow:row}#tierRow .tierN{display:grid;place-items:center;font:700 18px var(--font-display);color:var(--gold-2)}
#tierRow button{font-size:20px}
#maps b{font:700 12.5px var(--font-display);white-space:nowrap}
#maps i{font-style:normal;font-size:9.5px;letter-spacing:.05em;color:var(--gold-2)}
#maps button[aria-pressed="true"] i{color:#7a4a10}

/* ── 레벨업 선택 ── */
#choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:50px minmax(0,1fr);gap:11px;align-items:center;text-align:left;color:var(--paper);cursor:pointer;padding:9px 11px;border-radius:11px;border:1px solid #4a5684;
  background:linear-gradient(180deg,#2a3359,#171d39);box-shadow:0 0 0 2px var(--ink),0 3px 0 var(--ink),inset 0 1px 0 rgba(255,255,255,.1)}
.choice:active{transform:translateY(2px);box-shadow:0 0 0 2px var(--ink),0 1px 0 var(--ink)}
.choice img{width:54px;height:54px;border-radius:13px;filter:drop-shadow(0 2px 0 rgba(6,8,18,.55))} /* 아이콘이 제 타일을 갖고 있어 테두리를 따로 두르지 않는다 */
.choice .hd{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.choice b{font:700 16.5px var(--font-display);color:var(--gold-1);margin-right:2px}
.choice em{font-style:normal;font-weight:700;font-size:10.5px;color:var(--dim);background:rgba(154,163,191,.14);border-radius:99px;padding:1px 7px}
.choice em.el{color:#c8b4ff;background:rgba(150,110,255,.16)}
.choice em.sp{color:var(--xp);background:rgba(95,211,196,.16)}
.choice em.fz{color:#2a1904;background:var(--goldfill)}
.choice p{margin:3px 0 0;font-size:12px;line-height:1.45;color:#c2c8dc}
.choice.fuse{border-color:var(--gold-2);background:linear-gradient(180deg,#4a3d24,#221b12);box-shadow:0 0 0 2px var(--ink),0 3px 0 var(--ink),0 0 18px -2px rgba(230,180,80,.55),inset 0 1px 0 rgba(255,240,194,.25)}
#owned{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:11.5px;background:var(--well);border:1px solid #3a456e;border-radius:99px;padding:2px 9px 2px 3px}
.chip img{width:21px;height:21px}
#recipes{display:grid;gap:4px;text-align:left}
.rcp{display:grid;grid-template-columns:22px auto minmax(0,1fr);gap:7px;align-items:center;font-size:11.5px;color:var(--dim)}
.rcp img{width:22px;height:22px}
.rcp b{font:700 12.5px var(--font-display);color:var(--paper)}
.rcp span{text-align:right}
.rcp.on b,.rcp.on span{color:var(--gold-2)}

/* ── 장비 · 창고 ── */
.overlay.full{place-items:stretch center;background:radial-gradient(ellipse at 50% 0%,#1c2444,#0b0e1c 70%);padding-block:0;z-index:4}
.panel{width:min(560px,100%);box-sizing:border-box;min-height:0;display:grid;grid-template-rows:auto auto auto auto minmax(80px,1fr) auto auto;gap:8px;padding-block:12px}
.panel header{display:flex;justify-content:space-between;align-items:center}
#doll{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,52px));grid-auto-rows:minmax(0,52px);gap:6px;justify-content:space-between;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
  background:linear-gradient(180deg,#222b4d,#12172c);box-shadow:0 0 0 2px var(--ink),0 0 0 3px var(--gold-3),0 0 0 5px var(--ink),inset 0 0 40px rgba(0,0,0,.45)}
#doll::before{content:"";position:absolute;inset:8% 20% 6%;background:url(img/hero.png) center/contain no-repeat;opacity:.55;filter:drop-shadow(0 6px 10px rgba(0,0,0,.7))}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;align-content:start}
.cell{position:relative;aspect-ratio:1;min-width:0;padding:0;cursor:pointer;color:#7b84a6;font-weight:700;font-size:9.5px;line-height:1.1;border-radius:9px;border:1px solid #3d4872;
  background:radial-gradient(circle at 50% 110%,color-mix(in srgb,var(--gc,#000) 34%,transparent),transparent 70%),linear-gradient(180deg,#1b2242,#0e1326);background-size:auto,auto;
  box-shadow:0 0 0 2px var(--ink),inset 0 1px 0 rgba(255,255,255,.06)}
.cell[style*="background-image"]{border-color:var(--gc);background-position:center;background-size:84%;background-repeat:no-repeat;background-color:#12172c;
  box-shadow:0 0 0 2px var(--ink),inset 0 0 12px -3px var(--gc)}
.cell.g3,.cell.g4{box-shadow:0 0 0 2px var(--ink),0 0 12px -2px var(--gc),inset 0 0 14px -3px var(--gc)}
.cell.empty{border-style:dashed;background:rgba(10,12,23,.55)}
.cell small{position:absolute;right:3px;bottom:1px;font-size:9px;color:#fff;text-shadow:0 0 2px var(--ink),0 0 2px var(--ink),0 1px 0 var(--ink)}
#invNote{min-height:1.4em;font-size:12px;color:var(--gold-2);text-align:center}
#stashGrid{overflow:auto;min-height:0;padding:3px}
.empty-note{grid-column:1 / -1;margin:14px 0;text-align:center;font-size:12.5px;color:var(--dim)}
.lbl{display:flex;justify-content:space-between;align-items:baseline}
.lbl b{font:700 15px var(--font-display);color:var(--gold-1)}
.lbl span{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
